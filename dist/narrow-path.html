<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Narrow Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
:root {
  --parchment: #f4e4bc;
  --ink: #2c2c2c;
  --gold: #d4af37;
  --gold-glow: #ffd700;
  --blood: #8b1a1a;
  --faith: #4a90e2;
  --miracle: #ffb300;
  --shadow: #1a120b;
  --act-tint: #e8a44c;
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background-color: var(--parchment);
  background-image: url('assets/img/parchment.png'), radial-gradient(circle at center, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
  background-size: 512px auto, auto;
  background-repeat: repeat, no-repeat;
  background-blend-mode: multiply, overlay;
  color: var(--ink);
  font-family: 'EB Garamond', serif;
  overflow: hidden;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at center, transparent 70%, rgba(0, 0, 0, 0.5) 100%);
}

body[data-act="1"] .act-tint {
  background-color: var(--act-tint);
}

body[data-act="2"] .act-tint {
  background-color: #7a5ca8;
}

body[data-act="3"] .act-tint {
  background-color: #a83232;
}

.act-tint {
  position: fixed;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: multiply;
  opacity: 0.12;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
}

#fx-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
}

#boot {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2rem;
  font-family: 'Cinzel', serif;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  box-sizing: border-box;
}

.title-screen h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: 3.5rem;
  letter-spacing: 0.12em;
  color: var(--gold);
  text-shadow: 0 0 10px var(--gold-glow);
  margin-bottom: 2rem;
}

.btn {
  display: inline-block;
  padding: 0.5rem 1rem;
  margin: 0.5rem;
  border: 2px solid var(--gold);
  border-radius: 4px;
  background-color: var(--parchment);
  color: var(--ink);
  font-family: 'Cinzel', serif;
  font-size: 1.2rem;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: inset 0 0 0 1px var(--gold);
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.btn:hover {
  background-color: var(--gold);
  color: var(--parchment);
  box-shadow: inset 0 0 0 1px var(--parchment);
  text-shadow: 0 0 5px var(--gold-glow);
}

.btn:active {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  filter: grayscale(0.7);
}

.btn-primary {
  background-color: var(--gold);
  color: var(--parchment);
  box-shadow: inset 0 0 0 1px var(--parchment);
}

.btn-primary:hover {
  background-color: var(--parchment);
  color: var(--gold);
  box-shadow: inset 0 0 0 1px var(--gold);
}

.btn-ghost {
  background-color: transparent;
  border: none;
  box-shadow: none;
  outline: none;
}

.btn-ghost:hover {
  text-decoration: underline;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-2px); }
  40%, 80% { transform: translateX(2px); }
}

.btn.error {
  animation: shake 0.5s;
}

.card {
  position: relative;
  width: 150px;
  height: 210px;
  perspective: 1000px;
  margin: 0.5rem;
  cursor: pointer;
  transition: transform 0.18s;
}

.card:hover .card-inner {
  transform: rotateX(var(--tilt-x, 0)) rotateY(var(--tilt-y, 0)) translateY(-5px);
}

.card.selected {
  transform: translateY(-18px);
  box-shadow: 0 0 20px var(--gold-glow);
}

.card.unplayable {
  filter: grayscale(0.7) opacity(0.75);
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.18s;
  background-color: var(--parchment);
  border: 1px solid var(--ink);
  border-radius: 4px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

.cost-gem {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background-color: var(--ink);
  color: var(--parchment);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cinzel', serif;
  font-size: 1.2rem;
  z-index: 2;
}

.cost-gem.miracle {
  background-color: var(--faith);
}

.type-ribbon {
  position: absolute;
  top: 0;
  right: 0;
  width: 50px;
  height: 50px;
  background-color: var(--ink);
  transform: translate(25%, -25%) rotate(45deg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--parchment);
  font-family: 'Cinzel', serif;
  font-size: 1rem;
  z-index: 2;
}

.type-ribbon.attack {
  background-color: var(--blood);
}

.type-ribbon.skill {
  background-color: var(--faith);
}

.type-ribbon.power {
  background-color: #3a7d44;
}

.type-ribbon.miracle {
  background-color: var(--miracle);
}

.card-art {
  position: absolute;
  top: 50px;
  left: 0;
  width: 100%;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
}

.card-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-name {
  position: absolute;
  top: 130px;
  left: 0;
  width: 100%;
  padding: 0 10px;
  font-family: 'Cinzel', serif;
  font-size: 1rem;
  font-variant: small-caps;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rule {
  position: absolute;
  top: 160px;
  left: 10px;
  width: calc(100% - 20px);
  border: none;
  border-top: 2px solid var(--gold);
  border-bottom: 2px solid var(--gold);
  box-shadow: inset 0 0 0 1px var(--gold);
}

.card-text {
  position: absolute;
  top: 170px;
  left: 10px;
  width: calc(100% - 20px);
  height: 40px;
  font-size: 0.8rem;
  line-height: 1.2;
}

.card-text strong {
  color: var(--gold);
  text-shadow: 0 0 5px var(--gold-glow);
}

.kw {
  display: inline-block;
  padding: 2px 4px;
  margin: 0 2px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: bold;
}

.kw.Exhaust {
  background-color: #666;
  color: var(--parchment);
}

.kw.Ethereal {
  background-color: #a0d8f3;
  color: var(--ink);
}

.kw.Block {
  background-color: #4a90e2;
  color: var(--parchment);
}

.kw.Strength {
  background-color: #ff4d4d;
  color: var(--parchment);
}

.kw.Weak {
  background-color: #9b59b6;
  color: var(--parchment);
}

.kw.Vulnerable {
  background-color: #e67e22;
  color: var(--parchment);
}

.kw.Plague {
  background-color: #2ecc71;
  color: var(--parchment);
}

.kw.Faith {
  background-color: var(--faith);
  color: var(--parchment);
}

.kw.Retain {
  background-color: var(--gold);
  color: var(--parchment);
}

.kw.Innate {
  background-color: #f1c40f;
  color: var(--ink);
}

.card-up {
  position: absolute;
  bottom: 10px;
  left: 10px;
  width: calc(100% - 20px);
  font-size: 0.7rem;
  color: #3a7d44;
}

.rarity-starter {
  border: 2px solid var(--ink);
}

.rarity-common {
  border: 2px solid #666;
}

.rarity-uncommon {
  border: 2px solid var(--gold);
}

.rarity-rare {
  border: 2px solid var(--gold);
  animation: shimmer 2s infinite;
}

@keyframes shimmer {
  0% { box-shadow: 0 0 5px var(--gold-glow); }
  50% { box-shadow: 0 0 10px var(--gold-glow); }
  100% { box-shadow: 0 0 5px var(--gold-glow); }
}

.hand {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 80%;
}

.hand .card {
  transform: rotate(calc(var(--fan) * 1deg));
  transition: transform 0.3s;
}

.hand .card:hover {
  z-index: 10;
}

.enemy {
  position: relative;
  width: 200px;
  margin: 0 auto;
}

.arch-frame {
  position: relative;
  width: 200px;
  height: 200px;
  border-radius: 50% 50% 0 0;
  border: 3px solid var(--gold);
  border-image: linear-gradient(to right, transparent, var(--gold), transparent) 1;
  overflow: hidden;
}

.enemy img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: sepia(0.15);
}

.enemy.dead {
  animation: ink-dissolve 1s forwards;
}

@keyframes ink-dissolve {
  0% { opacity: 1; filter: blur(0); transform: scale(1); }
  100% { opacity: 0; filter: blur(10px); transform: scale(1.2); }
}

.hp-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 20px;
  background-color: var(--shadow);
}

.hp-bar-fill {
  height: 100%;
  background: linear-gradient(to right, #ff4d4d, #8b1a1a);
}

.hp-block {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background-color: var(--faith);
  opacity: 0.7;
}

.status-chip {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  align-items: center;
  padding: 2px 6px;
  border-radius: 20px;
  background-color: var(--shadow);
  color: var(--parchment);
  font-size: 0.8rem;
}

.status-chip.Strength {
  background-color: #ff4d4d;
}

.status-chip.Vulnerable {
  background-color: #e67e22;
}

.status-chip.Weak {
  background-color: #9b59b6;
}

.status-chip.Plague {
  background-color: #2ecc71;
}

.intent {
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background-color: var(--gold);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
}

.intent-warn {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(139, 26, 26, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(139, 26, 26, 0); }
  100% { box-shadow: 0 0 0 0 rgba(139, 26, 26, 0); }
}

.enemy.targetable {
  animation: pulse-gold 1s infinite;
}

@keyframes pulse-gold {
  0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
  100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
}

.damage-num {
  position: absolute;
  pointer-events: none;
  font-family: 'Cinzel', serif;
  font-size: 1.5rem;
  animation: float-up-fade 1s forwards;
}

@keyframes float-up-fade {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-50px); }
}

.dmg-white {
  color: var(--parchment);
}

.dmg-red {
  color: var(--blood);
}

.dmg-gold {
  color: var(--gold);
}

.player-panel {
  position: absolute;
  bottom: 20px;
  left: 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.faith-bar {
  width: 200px;
  height: 20px;
  background-color: var(--shadow);
  margin-bottom: 10px;
}

.faith-bar-fill {
  height: 100%;
  background-color: var(--faith);
}

.faith-bar-fill.high {
  box-shadow: 0 0 10px var(--gold-glow);
}

.energy-orb {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background-color: var(--gold);
  color: var(--parchment);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cinzel', serif;
  font-size: 1.5rem;
  margin-bottom: 10px;
}

.energy-orb.high {
  box-shadow: 0 0 10px var(--gold-glow);
}

.potion-belt {
  display: flex;
  margin-bottom: 10px;
}

.potion-slot {
  width: 40px;
  height: 40px;
  margin-right: 10px;
  background-color: var(--shadow);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.relic-tray {
  display: flex;
  flex-wrap: wrap;
  max-width: 300px;
}

.relic {
  width: 30px;
  height: 30px;
  margin-right: 10px;
  margin-bottom: 10px;
  background-color: var(--shadow);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.log-panel {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 200px;
  height: 300px;
  background-color: var(--parchment);
  border: 1px solid var(--ink);
  border-radius: 4px;
  padding: 10px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  overflow-y: auto;
  font-family: monospace;
  font-size: 0.8rem;
}

.map-screen {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.map-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 0.6rem 1rem;
  box-sizing: border-box;
  flex: none;
}

.floor-info {
  font-family: 'Cinzel', serif;
  letter-spacing: 0.06em;
  color: var(--ink);
}

.resources {
  display: flex;
  gap: 1.25rem;
  align-items: center;
}

.resource {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-weight: 600;
}

.resource.gold {
  color: #8a6d1d;
}

.resource.hp {
  color: #8b1a1a;
}

.resource.faith {
  color: #4a90e2;
}

.resource img {
  height: 1.1em;
  width: auto;
}

.map-wrap {
  position: relative;
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
}

.map-wrap > svg.map-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.path-line {
  stroke: var(--gold);
  stroke-width: 2;
  opacity: 0.6;
  fill: none;
}

.node {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 36px;
  height: 36px;
  box-sizing: border-box;
  border-radius: 50%;
  padding: 0;
  background: var(--parchment);
  border: 2px solid var(--gold);
  color: var(--ink);
  font-size: 15px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
  box-shadow: 0 2px 5px rgba(0,0,0,0.25);
  transition: transform 0.12s ease;
}

.node:hover {
  transform: translate(-50%, -50%) scale(1.15);
}

.node.passed {
  opacity: 0.4;
  cursor: default;
  box-shadow: none;
}

.node.chosen {
  opacity: 0.5;
}

.node.pulse {
  animation: pulse-node 1.5s infinite;
}

@keyframes pulse-node {
  0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.55); }
  70% { box-shadow: 0 0 0 9px rgba(212, 175, 55, 0); }
  100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
}

.node.boss {
  border-color: #8b1a1a;
  background: #2c2c2c;
  color: #d4af37;
  font-size: 17px;
}

.node.elite {
  border-color: #7a5ca8;
}

.node.rest {
  border-color: #3a7d44;
}

.node.shop {
  fill: #f1c40f;
}

.node.event {
  fill: #9b59b6;
}

.node.treasure {
  fill: #e67e22;
}

.node-icon {
  font-size: 1.5rem;
  text-anchor: middle;
  dominant-baseline: middle;
}

.reward-cards {
  display: flex;
  justify-content: center;
  margin-top: 2rem;
}

.reward-cards .card {
  animation: flip-in 0.5s forwards;
}

@keyframes flip-in {
  0% { transform: rotateY(90deg); }
  100% { transform: rotateY(0); }
}

.shop-grid, .deck-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 1rem;
  margin-top: 2rem;
}

.modal-box {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  max-width: 600px;
  background-color: var(--parchment);
  border: 2px solid var(--gold);
  border-radius: 4px;
  padding: 2rem;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  z-index: 1000;
  box-shadow: inset 0 0 0 1px var(--gold), 0 0 0 2px var(--gold);
}

.modal-title {
  font-family: 'Cinzel', serif;
  font-size: 1.5rem;
  margin-bottom: 1rem;
}

.modal-body {
  margin-bottom: 1rem;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
}

.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 1rem;
  border-radius: 4px;
  background-color: var(--parchment);
  border: 1px solid var(--ink);
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  animation: slide-in 0.3s forwards;
  z-index: 1000;
}

@keyframes slide-in {
  0% { transform: translate(-50%, -100%); }
  100% { transform: translate(-50%, 0); }
}

.toast.success {
  border-color: #3a7d44;
}

.toast.error {
  border-color: var(--blood);
}

.toast.info {
  border-color: var(--faith);
}

#tooltip {
  position: fixed;
  pointer-events: none;
  padding: 0.5rem;
  background-color: var(--shadow);
  color: var(--parchment);
  border: 1px solid var(--gold);
  border-radius: 4px;
  font-size: 0.8rem;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.2s;
}

#tooltip.show {
  opacity: 1;
}

.overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(5px);
  z-index: 999;
}

.settings-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  max-width: 500px;
  background-color: var(--parchment);
  border: 2px solid var(--gold);
  border-radius: 4px;
  padding: 2rem;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  z-index: 1000;
  box-shadow: inset 0 0 0 1px var(--gold), 0 0 0 2px var(--gold);
}

.settings-title {
  font-family: 'Cinzel', serif;
  font-size: 1.5rem;
  margin-bottom: 1rem;
}

.slider-container {
  margin-bottom: 1rem;
}

.slider-label {
  display: block;
  margin-bottom: 0.5rem;
}

input[type="range"] {
  width: 100%;
  height: 8px;
  -webkit-appearance: none;
  background: var(--ink);
  border-radius: 4px;
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--gold);
  cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--gold);
  cursor: pointer;
}

@media (max-width: 1100px) {
  .card {
    width: 120px;
    height: 180px;
  }

  html {
    font-size: 14px;
  }
}

@media (max-width: 1024px) {
  html {
    font-size: 12px;
  }
}


.hp-bar .fill {
  height: 100%;
  background: linear-gradient(to right, #ff4d4d, var(--blood));
}

.faith-bar .fill {
  height: 100%;
  background-color: var(--faith);
}

.faith-bar .fill.gold-glow {

.screen.combat {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 12px 16px;

}

.combat-top {
  flex: 1;
  display: flex;
  justify-content: center;
  position: relative;
  min-height: 0;
}

.enemy-stage {
  display: flex;
  gap: 40px;
  align-items: flex-start;
  justify-content: center;
  padding-top: 50px;
}

.screen.combat .hand {
  flex-wrap: nowrap;
  bottom: 68px;

}

.log-panel.log-hidden {
  display: none;
}

.player-hud {
  position: absolute;
  left: 16px;
  bottom: 150px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 5;
  width: 230px;
}

.player-hud .status-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  position: static;
}

.player-hud .hp-bar {
  position: relative;
  width: 220px;
  height: 22px;
  border: 1px solid var(--ink);
}

.player-hud .hp-block {
  position: absolute;
  right: -6px;
  top: -8px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--faith);
  color: var(--parchment);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .75rem;
}

.hp-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--parchment);
  font-size: .75rem;
}

.relic-icon, .potion-icon {

  align-items: center;
  justify-content: center;
  width: 30px;
  height: 16px;
  font-size: 16px;
  pointer-events: none;
}

.combat-controls {
  position: absolute;
  right: 16px;
  bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 12;
}

.pile-info {

.combat-overlay {

.combat-placeholder {

}

  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
  opacity: 0.85;
}

.title-screen::after {
  content: '';

}

.act-banner {

}

  <script>
(function() {
  const NP_AUDIO = {
    init() {
      if (this.audioCtx) return;
      try {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.audioCtx.createGain();
        this.musicGain = this.audioCtx.createGain();
        this.sfxGain = this.audioCtx.createGain();
        this.masterGain.connect(this.audioCtx.destination);
        this.musicGain.connect(this.masterGain);
        this.sfxGain.connect(this.masterGain);
        this.currentScene = null;
        this.faithLevel = 0;
        this.sfxVoices = {};
        this.loadSettings();
        this.initScenes();
        this.initSfx();
      } catch (e) {
        console.error('Web Audio API not supported', e);
        this.audioCtx = null;
      }
    },

    loadSettings() {
      if (!this.audioCtx) return;
      const settings = JSON.parse(localStorage.getItem('np_settings')) || {};
      this.setVol(
        settings.master !== undefined ? settings.master : 0.8,
        settings.music !== undefined ? settings.music : 0.7,
        settings.sfx !== undefined ? settings.sfx : 0.7
      );
    },

    setVol(master, music, sfx) {
      if (!this.audioCtx) return;
      this.masterGain.gain.value = master;
      this.musicGain.gain.value = music;
      this.sfxGain.gain.value = sfx;
      const settings = JSON.parse(localStorage.getItem('np_settings')) || {};
      localStorage.setItem('np_settings', JSON.stringify({
        ...settings,
        master,
        music,
        sfx
      }));
    },

    getVol() {
      if (!this.audioCtx) return { master: 0, music: 0, sfx: 0 };
      return {
        master: this.masterGain.gain.value,
        music: this.musicGain.gain.value,
        sfx: this.sfxGain.gain.value
      };
    },

    suspend() {
      if (this.audioCtx && this.audioCtx.state !== 'suspended') {
        this.audioCtx.suspend();
      }
    },

    resume() {
      if (this.audioCtx && this.audioCtx.state === 'suspended') {
        this.audioCtx.resume();
      }
    },

    initScenes() {
      this.scenes = {
        title: {
          pad: { type: 'sawtooth', detune: [0, 7, -5], lfo: { rate: 0.2, depth: 500 } },
          arp: { type: 'triangle', pattern: [0, 2, 4, 7, 9, 12, 14, 16], root: 60, bpm: 60 },
          chord: [0, 4, 7]
        },
        map: {
          pad: { type: 'sine', detune: [0, 7, -5], lfo: { rate: 0.3, depth: 600 } },
          arp: { type: 'triangle', pattern: [0, 2, 4, 5, 7, 9, 11, 12], root: 62, bpm: 80 },
          chord: [0, 2, 4]
        },
        combat: {
          pad: { type: 'sawtooth', detune: [0, 7, -5], lfo: { rate: 0.4, depth: 700 } },
          arp: { type: 'triangle', pattern: [0, 2, 4, 5, 7, 9, 11, 12], root: 64, bpm: 100 },
          chord: [0, 4, 7],
          percussion: true
        },
        elite: {
          pad: { type: 'sawtooth', detune: [0, 7, -5], lfo: { rate: 0.4, depth: 700 } },
          arp: { type: 'triangle', pattern: [0, 2, 4, 5, 7, 9, 11, 12], root: 65, bpm: 100 },
          chord: [0, 4, 7],
          percussion: true
        },
        boss: {
          pad: { type: 'sawtooth', detune: [0, 7, -5], lfo: { rate: 0.4, depth: 700 } },
          arp: { type: 'triangle', pattern: [0, 2, 4, 5, 7, 9, 11, 12], root: 60, bpm: 100 },
          chord: [0, 3, 7],
          percussion: true
        },
        victory: {
          pad: { type: 'sine', detune: [0, 7, -5], lfo: { rate: 0.3, depth: 600 } },
          arp: { type: 'triangle', pattern: [0, 2, 4, 7, 9, 12, 14, 16], root: 67, bpm: 80 },
          chord: [0, 4, 7]
        },
        defeat: {
          pad: { type: 'sine', detune: [0, 7, -5], lfo: { rate: 0.2, depth: 500 } },
          arp: { type: 'triangle', pattern: [0, 2, 4, 5, 7, 9, 11, 12], root: 55, bpm: 60 },
          chord: [0, 3, 7]
        },
        shop: {
          pad: { type: 'sine', detune: [0, 7, -5], lfo: { rate: 0.3, depth: 600 } },
          arp: { type: 'triangle', pattern: [0, 2, 4, 5, 7, 9, 11, 12], root: 65, bpm: 80 },
          chord: [0, 4, 7]
        }
      };
    },

    initSfx() {
      this.sfxBank = {
        card_draw: { type: 'noise', duration: 0.1, filter: { type: 'bandpass', Q: 10, frequency: 1000 } },
        card_play: { type: 'noise', duration: 0.2, filter: { type: 'bandpass', Q: 10, frequency: 2000 } },
        card_exhaust: { type: 'noise', duration: 0.3, filter: { type: 'lowpass', frequency: 500, ramp: -1000 } },
        hit: { type: 'custom', duration: 0.3, envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 0.1 } },
        block: { type: 'custom', duration: 0.2, envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.05 } },
        heal: { type: 'sine', duration: 0.5, frequency: 880, ramp: 440 },
        gold: { type: 'custom', duration: 0.2, envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.05 } },
        potion: { type: 'custom', duration: 0.3, envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 0.1 } },
        relic: { type: 'custom', duration: 0.5, envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.2 } },
        miracle: { type: 'custom', duration: 1.0, envelope: { attack: 0.1, decay: 0.3, sustain: 0.5, release: 0.3 } },
        turn_start: { type: 'custom', duration: 0.3, envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 0.1 } },
        victory: { type: 'custom', duration: 2.0, envelope: { attack: 0.1, decay: 0.5, sustain: 1.0, release: 0.5 } },
        defeat: { type: 'custom', duration: 1.5, envelope: { attack: 0.1, decay: 0.3, sustain: 0.7, release: 0.5 } },
        menu_hover: { type: 'custom', duration: 0.1, envelope: { attack: 0.01, decay: 0.05, sustain: 0.05, release: 0.01 } },
        menu_click: { type: 'custom', duration: 0.2, envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.05 } },
        error: { type: 'custom', duration: 0.1, envelope: { attack: 0.01, decay: 0.05, sustain: 0.05, release: 0.01 } },
        intent_warn: { type: 'custom', duration: 0.2, envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.05 } }
      };
    },

    playScene(name) {
      if (!this.audioCtx || this.currentScene === name) return;
      this.stopCurrentScene();
      this.currentScene = name;
      const scene = this.scenes[name];
      if (!scene) return;

      this.sceneGain = this.audioCtx.createGain();
      this.sceneGain.gain.value = 0;
      this.sceneGain.connect(this.musicGain);

      this.padGain = this.audioCtx.createGain();
      this.padGain.gain.value = 0.3;
      this.padGain.connect(this.sceneGain);

      this.arpGain = this.audioCtx.createGain();
      this.arpGain.gain.value = 0;
      this.arpGain.connect(this.sceneGain);

      this.choralGain = this.audioCtx.createGain();
      this.choralGain.gain.value = 0;
      this.choralGain.connect(this.sceneGain);

      this.createPad(scene.pad);
      this.createArp(scene.arp, scene.chord);
      this.createChoral();

      if (scene.percussion) {
        this.createPercussion();
      }

      this.sceneGain.gain.linearRampToValueAtTime(1, this.audioCtx.currentTime + 1.2);
      this.setFaithLevel(this.faithLevel);
    },

    stopCurrentScene() {
      if (this.sceneGain) {
        this.sceneGain.gain.linearRampToValueAtTime(0, this.audioCtx.currentTime + 1.2);
        setTimeout(() => {
          if (this.sceneGain) {
            this.sceneGain.disconnect();
            this.sceneGain = null;
          }
        }, 1200);
      }
      if (this.scheduler) {
        clearInterval(this.scheduler);
        this.scheduler = null;
      }
    },

    createPad(config) {
      const pad = this.audioCtx.createGain();
      pad.connect(this.padGain);

      const lowpass = this.audioCtx.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.value = 500;
      lowpass.connect(pad);

      const lfo = this.audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = config.lfo.rate;
      lfo.start();

      const lfoGain = this.audioCtx.createGain();
      lfoGain.gain.value = config.lfo.depth;
      lfo.connect(lfoGain);
      lfoGain.connect(lowpass.frequency);

      config.detune.forEach((detune, i) => {
        const osc = this.audioCtx.createOscillator();
        osc.type = config.type;
        osc.detune.value = detune;
        osc.start();
        osc.connect(lowpass);
      });
    },

    createArp(config, chord) {
      this.arpPattern = config.pattern;
      this.arpRoot = config.root;
      this.arpBpm = config.bpm;
      this.arpChord = chord;
      this.arpType = config.type;

      this.scheduler = setInterval(() => {
        const now = this.audioCtx.currentTime;
        const lookahead = 0.1;
        const nextNoteTime = now + lookahead;

        if (this.arpGain.gain.value > 0) {
          this.scheduleArpNote(nextNoteTime);
        }
      }, 25);
    },

    scheduleArpNote(time) {
      const noteIndex = Math.floor((time * this.arpBpm / 60) % this.arpPattern.length);
      const note = this.arpPattern[noteIndex];
      const frequency = 440 * Math.pow(2, (this.arpRoot + note) / 12);

      const osc = this.audioCtx.createOscillator();
      osc.type = this.arpType;
      osc.frequency.value = frequency;
      osc.start(time);
      osc.stop(time + 0.1);

      const gain = this.audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, time);
      gain.gain.linearRampToValueAtTime(0, time + 0.1);
      osc.connect(gain);
      gain.connect(this.arpGain);
    },

    createChoral() {
      const choral = this.audioCtx.createGain();
      choral.connect(this.choralGain);

      for (let i = 0; i < 3; i++) {
        const osc = this.audioCtx.createOscillator();
        osc.type = 'sine';
        osc.detune.value = i * 7 - 7;
        osc.start();

        const lfo = this.audioCtx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.5 + i * 0.2;
        lfo.start();

        const lfoGain = this.audioCtx.createGain();
        lfoGain.gain.value = 5;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        osc.connect(choral);
      }
    },

    createPercussion() {
      this.percussionGain = this.audioCtx.createGain();
      this.percussionGain.gain.value = 0.5;
      this.percussionGain.connect(this.sceneGain);

      this.scheduler = setInterval(() => {
        const now = this.audioCtx.currentTime;
        const lookahead = 0.1;
        const nextNoteTime = now + lookahead;

        if (this.percussionGain) {
          this.schedulePercussion(nextNoteTime);
        }
      }, 25);
    },

    schedulePercussion(time) {
      const kick = this.audioCtx.createGain();
      kick.gain.setValueAtTime(0, time);
      kick.gain.linearRampToValueAtTime(1, time + 0.01);
      kick.gain.linearRampToValueAtTime(0, time + 0.1);
      kick.connect(this.percussionGain);

      const kickOsc = this.audioCtx.createOscillator();
      kickOsc.type = 'triangle';
      kickOsc.frequency.setValueAtTime(60, time);
      kickOsc.frequency.linearRampToValueAtTime(40, time + 0.1);
      kickOsc.start(time);
      kickOsc.stop(time + 0.1);
      kickOsc.connect(kick);

      if (Math.random() > 0.5) {
        const hat = this.audioCtx.createGain();
        hat.gain.setValueAtTime(0, time);
        hat.gain.linearRampToValueAtTime(0.3, time + 0.01);
        hat.gain.linearRampToValueAtTime(0, time + 0.05);
        hat.connect(this.percussionGain);

        const hatOsc = this.audioCtx.createOscillator();
        hatOsc.type = 'sawtooth';
        hatOsc.frequency.value = 8000;
        hatOsc.start(time);
        hatOsc.stop(time + 0.05);
        hatOsc.connect(hat);
      }
    },

    setFaithLevel(f) {
      if (!this.audioCtx) return;
      this.faithLevel = f;
      const now = this.audioCtx.currentTime;
      const rampTime = 0.8;

      if (f < 30) {
        this.arpGain.gain.linearRampToValueAtTime(0, now + rampTime);
        this.choralGain.gain.linearRampToValueAtTime(0, now + rampTime);
      } else if (f < 70) {
        this.arpGain.gain.linearRampToValueAtTime(0.5, now + rampTime);
        this.choralGain.gain.linearRampToValueAtTime(0, now + rampTime);
      } else {
        this.arpGain.gain.linearRampToValueAtTime(0.5, now + rampTime);
        this.choralGain.gain.linearRampToValueAtTime(0.3, now + rampTime);
      }
    },

    sfx(name, opts = {}) {
      if (!this.audioCtx || !this.sfxBank[name]) return;
      if (!this.sfxVoices[name]) this.sfxVoices[name] = 0;
      if (this.sfxVoices[name] >= 6) return;
      this.sfxVoices[name]++;

      const config = this.sfxBank[name];
      const now = this.audioCtx.currentTime;
      const gain = this.audioCtx.createGain();
      gain.connect(this.sfxGain);

      if (config.type === 'noise') {
        const bufferSize = this.audioCtx.sampleRate * config.duration;
        const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const source = this.audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(gain);
        source.start(now);

        if (config.filter) {
          const filter = this.audioCtx.createBiquadFilter();
          filter.type = config.filter.type;
          filter.Q.value = config.filter.Q || 0;
          filter.frequency.value = config.filter.frequency;
          if (config.filter.ramp) {
            filter.frequency.linearRampToValueAtTime(
              config.filter.frequency + config.filter.ramp,
              now + config.duration
            );
          }
          source.connect(filter);
          filter.connect(gain);
        }

        source.onended = () => {
          this.sfxVoices[name]--;
        };
      } else if (config.type === 'custom') {
        const osc = this.audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = opts.pitch || 440;
        osc.start(now);
        osc.stop(now + config.duration);

        const envelope = this.audioCtx.createGain();
        envelope.gain.setValueAtTime(0, now);
        envelope.gain.linearRampToValueAtTime(
          opts.vol || 1,
          now + config.envelope.attack
        );
        envelope.gain.linearRampToValueAtTime(
          opts.vol || 1 * config.envelope.sustain,
          now + config.envelope.attack + config.envelope.decay
        );
        envelope.gain.linearRampToValueAtTime(
          0,
          now + config.duration - config.envelope.release
        );
        osc.connect(envelope);
        envelope.connect(gain);

        osc.onended = () => {
          this.sfxVoices[name]--;
        };
      } else {
        const osc = this.audioCtx.createOscillator();
        osc.type = config.type;
        osc.frequency.value = config.frequency || 440;
        if (config.ramp) {
          osc.frequency.linearRampToValueAtTime(
            config.frequency + config.ramp,
            now + config.duration
          );
        }
        osc.start(now);
        osc.stop(now + config.duration);

        const gainNode = this.audioCtx.createGain();
        gainNode.gain.value = opts.vol || 1;
        osc.connect(gainNode);
        gainNode.connect(gain);

        osc.onended = () => {
          this.sfxVoices[name]--;
        };
      }

      gain.gain.value = opts.vol || 1;
    }
  };

  window.NP_AUDIO = NP_AUDIO;
})();

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: 0, y: 0, vx: 0, vy: 0, size: 0, color: '#000', alpha: 1,
        rotation: 0, vRotation: 0, gravity: 0, lifetime: 0, active: false
      });
    }
  }

  function updateParticles(delta) {
    let newActiveCount = 0;
    const deltaSeconds = delta / 1000;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = particles[i];
      if (!p.active) continue;

      p.x += p.vx * deltaSeconds;
      p.y += p.vy * deltaSeconds;
      p.vy += p.gravity * deltaSeconds;
      p.rotation += p.vRotation * deltaSeconds;
      p.lifetime -= delta;

      if (p.lifetime <= 0) {
        p.active = false;
      } else {
        newActiveCount++;
      }
    }

    activeParticles = newActiveCount;
    if (activeParticles === 0 && animationFrameId !== null) {
      cancelAnimationFrame(animationFrameId);
      animationFrameId = null;
    }
  }

  function renderParticles() {
    if (activeParticles === 0) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = particles[i];
      if (!p.active) continue;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = p.alpha * (p.lifetime / 1000);
      ctx.fillStyle = p.color;

      ctx.beginPath();
      ctx.arc(0, 0, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function animate(timestamp) {
    if (!lastTimestamp) {
      lastTimestamp = timestamp;
    }

    const delta = Math.min(timestamp - lastTimestamp, MAX_DELTA);
    lastTimestamp = timestamp;

    updateParticles(delta);
    renderParticles();

    if (activeParticles > 0) {
      animationFrameId = requestAnimationFrame(animate);
    }
  }

  function startAnimation() {
    if (animationFrameId === null) {
      lastTimestamp = null;
      animationFrameId = requestAnimationFrame(animate);
    }
  }

  function createParticle(x, y, vx, vy, size, color, lifetime, gravity, rotation, vRotation) {
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      if (!particles[i].active) {
        particles[i] = {
          x, y, vx, vy, size, color, alpha: 1, rotation, vRotation,
          gravity, lifetime, active: true
        };
        activeParticles++;
        return;
      }
    }
  }

  function burst(x, y, opts = {}) {
    const { color = '#2c2c2c', count = 20, spread = 100 } = opts;

    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * spread;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      const size = 2 + Math.random() * 4;
      const lifetime = 500 + Math.random() * 500;
      const gravity = 900;
      const rotation = Math.random() * Math.PI * 2;
      const vRotation = (Math.random() - 0.5) * 2;

      createParticle(x, y, vx, vy, size, color, lifetime, gravity, rotation, vRotation);
    }

    startAnimation();
  }

  function damageNumber(x, y, amount, kind) {
    const color = colors[kind] || '#fff';
    const size = 20 + Math.min(amount / 10, 30);
    const lifetime = 900;
    const vx = (Math.random() - 0.5) * 20;
    const vy = -60;
    const gravity = 0;

    createParticle(x, y, vx, vy, size, color, lifetime, gravity, 0, 0);

    startAnimation();
  }

  function shake(mag, dur) {
    if (shakeTimer) {
      clearTimeout(shakeTimer);
      document.body.style.transform = '';
      document.documentElement.style.transform = '';
    }

    shakeMag = mag;
    shakeDuration = dur;
    shakeStart = Date.now();

    function updateShake() {
      const elapsed = Date.now() - shakeStart;
      if (elapsed >= shakeDuration) {
        document.body.style.transform = '';
        document.documentElement.style.transform = '';
        shakeTimer = null;
        return;
      }

      const progress = elapsed / shakeDuration;
      const currentMag = shakeMag * (1 - progress);
      const x = (Math.random() - 0.5) * currentMag * 2;
      const y = (Math.random() - 0.5) * currentMag * 2;

      const transform = `translate(${x}px, ${y}px)`;
      if (document.body.firstChild) {
        document.body.firstChild.style.transform = transform;
      } else {
        document.documentElement.style.transform = transform;
      }

      shakeTimer = setTimeout(updateShake, 16);
    }

    updateShake();
  }

  function flash(color) {
    if (flashDiv) {
      document.body.removeChild(flashDiv);
    }

    flashDiv = document.createElement('div');
    flashDiv.style.position = 'fixed';
    flashDiv.style.top = '0';
    flashDiv.style.left = '0';
    flashDiv.style.width = '100%';
    flashDiv.style.height = '100%';
    flashDiv.style.backgroundColor = color;
    flashDiv.style.opacity = '0.5';
    flashDiv.style.pointerEvents = 'none';
    flashDiv.style.zIndex = '9998';
    flashDiv.style.transition = 'opacity 350ms ease-out';

    document.body.appendChild(flashDiv);

    setTimeout(() => {
      flashDiv.style.opacity = '0';
      setTimeout(() => {
        if (flashDiv && flashDiv.parentNode) {
          document.body.removeChild(flashDiv);
        }
        flashDiv = null;
      }, 350);
    }, 10);
  }

  function sparkles(el) {
    const rect = el.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;

    burst(x, y, {
      color: '#ffd700',
      count: 12,
      spread: 50
    });
  }

  function setCanvas(zIndex) {
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = zIndex.toString();
      document.body.appendChild(canvas);

      ctx = canvas.getContext('2d');
      initParticlePool();
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  }

  window.NP_FX = {
    burst,
    damageNumber,
    shake,
    flash,
    sparkles,
    setCanvas
  };
})();

  <script>
(function() {
  'use strict';

  window.NP_OPS = {
    applyCardEffects: function(G, inst, def, targetIdx) {
      if (def.type === 'power') {

        G.combat.powers.push(inst);
        def.effects.forEach(function(eff) {
          var value = inst.upgraded ? eff.up : eff.base;

          } else if (eff.op === 'combatStartBlock') {
            window.NP_OPS.gainBlock(G, 'player', value);
          }
        });

      }

      def.effects.forEach(function(eff) {
        var value = inst.upgraded ? eff.up : eff.base;
        switch (eff.op) {
          case 'damage':
            if (def.target === 'enemy') {
              for (var i = 0; i < (eff.times || 1); i++) {
                window.NP_OPS.hitEnemy(G, targetIdx, value, {fromAttack: true});
              }
            } else if (def.target === 'all') {
              G.combat.enemies.forEach(function(enemy, idx) {
                if (enemy.hp > 0) {
                  for (var i = 0; i < (eff.times || 1); i++) {
                    window.NP_OPS.hitEnemy(G, idx, value, {fromAttack: true});
                  }
                }
              });
            }
            break;
          case 'block':
            window.NP_OPS.gainBlock(G, 'player', value);
            break;
          case 'faith':
            G.run.faith = Math.min(100, G.run.faith + value);
            if (window.NP_AUDIO) window.NP_AUDIO.setFaithLevel(G.run.faith);
            break;
          case 'draw':
            window.NP_OPS.drawCards(G, value);
            break;
          case 'energy':
            G.combat.energy += value;
            break;
          case 'heal':
            G.run.hp = Math.min(G.run.maxHp, G.run.hp + value);
            break;
          case 'strength':
          case 'weak':
          case 'vulnerable':
          case 'plague':
            window.NP_OPS.addStatus(G, 'player', eff.op, value);
            break;
          case 'cleanse':
            G.combat.playerStatuses.vulnerable = 0;
            G.combat.playerStatuses.weak = 0;
            G.combat.playerStatuses.plague = 0;
            break;
        }
        G.combat.log.push({card: inst.id, effect: eff.op, value: value});
      });
    },

    hitEnemy: function(G, idx, base, opts) {
      opts = opts || {};
      var fromAttack = opts.fromAttack !== false;
      var enemy = G.combat.enemies[idx];
      if (!enemy || enemy.hp <= 0) return 0;

      var raw = base;
      if (fromAttack) {
        raw += G.combat.playerStatuses.strength;
        if (G.combat.playerStatuses.weak > 0) {
          raw = Math.floor(raw * 0.75);
        }
        if (enemy.statuses.vulnerable > 0) {
          raw = Math.floor(raw * 1.5);
        }
      }

      var absorbed = Math.min(enemy.block, raw);
      enemy.block -= absorbed;
      raw -= absorbed;

      if (raw > 0) {
        enemy.hp -= raw;
        if (enemy.hp <= 0) {
          enemy.hp = 0;
          enemy.dead = true;
          window.NP_OPS.fireRelic(G, 'faithOnKill');
          if (enemy.def.tier === 'elite') {
            window.NP_OPS.fireRelic(G, 'faithOnEliteKill');
          }
          G.combat.log.push({enemy: enemy.id, event: 'defeated'});

      }

      return raw;
    },

    hitPlayer: function(G, amount, fromIdx) {

      G.combat.playerBlock -= absorbed;

      if (amount > 0) {

      if (retaliation > 0 && fromIdx != null && G.combat.enemies[fromIdx] && G.combat.enemies[fromIdx].hp > 0) {

    drawCards: function(G, n) {

    tickStatuses: function(G, side) {

        var random = Math.random() * totalWeight;
        var weightSum = 0;
        for (var i = 0; i < def.moves.length; i++) {

                    data.potionDef.value += relic.value2;
                  }
                  if (data.potionDef.effect2) {
                    if (data.potionDef.effect2 === 'heal' || data.potionDef.effect2 === 'block' ||

                        data.potionDef.effect2 === 'faith' || data.potionDef.effect2 === 'energy') {
                      data.potionDef.value2 += relic.value2;
                    }
                  }
                }
                break;
            }
          }
        }
      });
    }
  };
})();

  function findAliveEnemyIndex(G, uid) {

  }

  function findCardInDraw(G, uid) {

  }

    return G.combat.discard.find(card => card.uid === uid);
  }

  function findCardInExhaust(G, uid) {
    return G.combat.exhaust.find(card => card.uid === uid);
  }

  function findCardInAnyPile(G, uid) {
    return findCardInHand(G, uid) || findCardInPowers(G, uid) || findCardInDeck(G, uid) ||
           findCardInDraw(G, uid) || findCardInDiscard(G, uid) || findCardInExhaust(G, uid);
  }

  function findCardIndexInHand(G, uid) {
    return G.combat.hand.findIndex(card => card.uid === uid);
  }

  function findCardIndexInPowers(G, uid) {
    return G.combat.powers.findIndex(card => card.uid === uid);
  }

  function findCardIndexInDeck(G, uid) {
    return G.run.deck.findIndex(card => card.uid === uid);
  }

  function findCardIndexInDraw(G, uid) {
    return G.combat.draw.findIndex(card => card.uid === uid);
  }

  function findCardIndexInDiscard(G, uid) {
    return G.combat.discard.findIndex(card => card.uid === uid);
  }

  function findCardIndexInExhaust(G, uid) {
    return G.combat.exhaust.findIndex(card => card.uid === uid);
  }

  function findCardIndexInAnyPile(G, uid) {
    let index = findCardIndexInHand(G, uid);
    if (index !== -1) return { pile: 'hand', index };
    index = findCardIndexInPowers(G, uid);
    if (index !== -1) return { pile: 'powers', index };
    index = findCardIndexInDeck(G, uid);
    if (index !== -1) return { pile: 'deck', index };
    index = findCardIndexInDraw(G, uid);
    if (index !== -1) return { pile: 'draw', index };
    index = findCardIndexInDiscard(G, uid);
    if (index !== -1) return { pile: 'discard', index };
    index = findCardIndexInExhaust(G, uid);
    if (index !== -1) return { pile: 'exhaust', index };
    return null;
  }

  function removeCardFromPile(G, pile, index) {
    if (pile === 'hand') {
      G.combat.hand.splice(index, 1);
    } else if (pile === 'powers') {
      G.combat.powers.splice(index, 1);
    } else if (pile === 'deck') {
      G.run.deck.splice(index, 1);
    } else if (pile === 'draw') {
      G.combat.draw.splice(index, 1);
    } else if (pile === 'discard') {
      G.combat.discard.splice(index, 1);
    } else if (pile === 'exhaust') {
      G.combat.exhaust.splice(index, 1);

  function applyCardEffects(G, inst, def, targetIdx) {

  function playCard(G, uid, targetUid) {
    const inst = findCardInHand(G, uid);
    if (!inst) return false;
    const def = NP_CARDS[inst.id];
    if (!def) return false;

    const canPlayResult = canPlay(G, uid, targetUid);
    if (!canPlayResult.ok) return false;

    let targetIdx = null;
    if (def.target === 'enemy') {
      if (targetUid) {
        targetIdx = findAliveEnemyIndex(G, targetUid);
        if (targetIdx === -1) return false;
      } else {
        const aliveEnemies = findAliveEnemies(G);
        if (aliveEnemies.length === 1) {
          targetIdx = G.combat.enemies.indexOf(aliveEnemies[0]);
        } else if (aliveEnemies.length === 0) {
          return false;
        } else {
          return false;
        }
      }
    }

    G.combat.energy -= def.cost;
    if (def.type === 'miracle') {
      G.run.faith -= def.faithCost;
      if (window.NP_AUDIO) NP_AUDIO.setFaithLevel(G.run.faith);
    }

    const cardIndex = findCardIndexInHand(G, uid);
    if (cardIndex !== -1) {
      G.combat.hand.splice(cardIndex, 1);
    }

    applyCardEffects(G, inst, def, targetIdx);

    if (def.type === 'attack') {
      const weakOnAttackPowers = G.combat.powers.filter(power => {
        const powerDef = NP_CARDS[power.id];
        return powerDef && powerDef.effects.some(effect => effect.op === 'weakOnAttack');
      });

      weakOnAttackPowers.forEach(power => {
        const powerDef = NP_CARDS[power.id];
        const effect = powerDef.effects.find(effect => effect.op === 'weakOnAttack');
        if (effect) {
          const value = power.upgraded ? effect.up : effect.base;
          const aliveEnemies = findAliveEnemies(G);
          if (aliveEnemies.length > 0) {
            const randomEnemy = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
            const enemyIdx = G.combat.enemies.indexOf(randomEnemy);
            NP_OPS.addStatus(G, enemyIdx, 'weak', value);
          }
        }
      });
    }

    if (window.NP_AUDIO) NP_AUDIO.sfx('card_play');
    G.combat.selectedCard = null;
    G.combat.targetMode = null;
    G.combat.log.push(`Played ${def.name}`);

    if (findAliveEnemies(G).length === 0) {
      finish(G, 'victory');
    } else if (G.run.hp <= 0) {
      finish(G, 'defeat');
    }

    return true;
  }

  function endTurn(G) {
    if (G.combat.over) return;

    G.combat.hand.forEach(inst => {
      const def = NP_CARDS[inst.id];
      if (def && def.ethereal && !def.retain) {
        G.combat.exhaust.push(inst);
        if (window.NP_AUDIO) NP_AUDIO.sfx('card_exhaust');
      } else if (def && def.retain) {
        // Keep in hand
      } else {
        G.combat.discard.push(inst);
      }
    });

    G.combat.hand = G.combat.hand.filter(inst => {
      const def = NP_CARDS[inst.id];
      return def && def.retain;
    });

    NP_OPS.tickStatuses(G, 'player');

    G.combat.enemies.forEach((enemy, idx) => {
      if (enemy.hp > 0 && enemy.intent) {
        const prevPlayerHp = G.run.hp;
        NP_OPS.enemyExecute(G, enemy, enemy.intent);
        if (prevPlayerHp > G.run.hp && G.run.relics.some(relic => relic.hook === 'strengthOnHurt')) {
          NP_OPS.fireRelic(G, 'strengthOnHurt');
        }
        NP_OPS.enemyChooseMove(G, enemy);
      }
    });

    if (G.run.hp <= 0) {
      finish(G, 'defeat');
      return;
    }

    G.combat.turn++;
    G.combat.playerBlock = 0;
    G.combat.potionUsed = false;

    NP_OPS.fireRelic(G, 'blockOnTurnStart');

    NP_OPS.plagueTick(G, 'player');
    if (G.run.hp <= 0) {
      finish(G, 'defeat');
      return;
    }

    G.combat.energy = G.combat.maxEnergy;

    const drawPerTurnPowers = G.combat.powers.filter(power => {
      const powerDef = NP_CARDS[power.id];
      return powerDef && powerDef.effects.some(effect => effect.op === 'drawPerTurn');
    });

    let extraDraws = 0;
    drawPerTurnPowers.forEach(power => {
      const powerDef = NP_CARDS[power.id];
      const effect = powerDef.effects.find(effect => effect.op === 'drawPerTurn');
      if (effect) {
        extraDraws += power.upgraded ? effect.up : effect.base;
      }
    });

    NP_OPS.drawCards(G, 5 + extraDraws);

    if (window.NP_AUDIO) NP_AUDIO.sfx('turn_start');

    G.combat.enemies.forEach((enemy, idx) => {
      if (enemy.hp > 0) {
        NP_OPS.tickStatuses(G, idx);
      }
    });

    const blockPerTurnPowers = G.combat.powers.filter(power => {
      const powerDef = NP_CARDS[power.id];
      return powerDef && powerDef.effects.some(effect => effect.op === 'blockPerTurn');
    });

    blockPerTurnPowers.forEach(power => {
      const powerDef = NP_CARDS[power.id];
      const effect = powerDef.effects.find(effect => effect.op === 'blockPerTurn');
      if (effect) {
        const value = power.upgraded ? effect.up : effect.base;
        NP_OPS.gainBlock(G, 'player', value);
      }
    });

    const strengthPerTurnPowers = G.combat.powers.filter(power => {
      const powerDef = NP_CARDS[power.id];
      return powerDef && powerDef.effects.some(effect => effect.op === 'strengthPerTurn');
    });

    strengthPerTurnPowers.forEach(power => {
      const powerDef = NP_CARDS[power.id];
      const effect = powerDef.effects.find(effect => effect.op === 'strengthPerTurn');
      if (effect) {
        const value = power.upgraded ? effect.up : effect.base;
        NP_OPS.addStatus(G, 'player', 'strength', value);
      }
    });

    const faithPerTurnPowers = G.combat.powers.filter(power => {
      const powerDef = NP_CARDS[power.id];
      return powerDef && powerDef.effects.some(effect => effect.op === 'faithPerTurn');
    });

    faithPerTurnPowers.forEach(power => {
      const powerDef = NP_CARDS[power.id];
      const effect = powerDef.effects.find(effect => effect.op === 'faithPerTurn');
      if (effect) {
        const value = power.upgraded ? effect.up : effect.base;
        G.run.faith += value;
        if (window.NP_AUDIO) NP_AUDIO.setFaithLevel(G.run.faith);
      }
    });

    NP_OPS.fireRelic(G, 'faithPerTurnCombat');

    if (findAliveEnemies(G).length === 0) {
      finish(G, 'victory');
    }
  }

  function selectCard(G, uid) {
    const inst = findCardInHand(G, uid);
    if (!inst) return;
    const def = NP_CARDS[inst.id];
    if (!def) return;

    if (def.target === 'enemy' && findAliveEnemies(G).length > 1) {
      G.combat.selectedCard = uid;
      G.combat.targetMode = 'enemy';
    } else {
      G.combat.selectedCard = uid;
      G.combat.targetMode = null;
    }
  }

  function cancelSelect(G) {
    G.combat.selectedCard = null;
    G.combat.targetMode = null;
  }

  function usePotion(G, id) {
    if (G.combat.over || G.combat.potionUsed) return false;
    const def = NP_POTIONS[id];
    if (!def) return false;
    const ok = NP_OPS.applyPotion(G, def);
    if (ok) {
      G.combat.potionUsed = true;
    }
    return ok;
  }

  function canPlay(G, uid, targetUid) {
    const inst = findCardInHand(G, uid);
    if (!inst) return { ok: false, reason: 'Not in hand' };
    const def = NP_CARDS[inst.id];
    if (!def) return { ok: false, reason: 'Invalid card' };

    if (G.combat.over) return { ok: false, reason: 'Combat over' };

    if (G.combat.energy < def.cost) return { ok: false, reason: 'Not enough Energy' };

    if (def.type === 'miracle' && G.run.faith < def.faithCost) {
      return { ok: false, reason: `Need ${def.faithCost} Faith` };
    }

    if (def.type === 'curse' || def.unplayable) return { ok: false, reason: 'Unplayable' };

    if (def.target === 'enemy') {
      const aliveEnemies = findAliveEnemies(G);
      if (aliveEnemies.length === 0) return { ok: false, reason: 'No targets' };
      if (aliveEnemies.length > 1 && !targetUid) return { ok: false, reason: 'Choose a target' };
    }

    return { ok: true, reason: '' };
  }

  function isOver(G) {
    return !!G.combat && G.combat.over !== null;
  }

  function result(G) {
    return { win: G.combat.over === 'victory', hp: G.run.hp };
  }

  function finish(G, outcome) {
    G.combat.over = outcome;
    if (outcome === 'victory') {
      NP_OPS.fireRelic(G, 'goldOnVictory');
      G.run.gold += Math.ceil(G.run.faith / 25);
      G.combat.log.push(`Gained ${Math.ceil(G.run.faith / 25)} gold from Faith`);
    }
  }

  function start(G, run, enemyIds) {
    G.combat = {
      enemies: [],
      draw: [],
      hand: [],
      discard: [],
      exhaust: [],
      powers: [],
      energy: 0,
      maxEnergy: 3,
      turn: 1,
      selectedCard: null,
      targetMode: null,
      playerBlock: 0,
      playerStatuses: { strength: 0, vulnerable: 0, weak: 0, plague: 0 },
      potionUsed: false,
      log: [],
      over: null
    };

    G.run.faith = 0;
    NP_OPS.fireRelic(G, 'startingFaith');

    G.run.deck.forEach(inst => {
      G.combat.draw.push({ uid: inst.uid, id: inst.id, upgraded: inst.upgraded });
    });

    shuffle(G.combat.draw);

    enemyIds.forEach((id, i) => {
      const def = NP_ENEMIES[id];
      if (def) {
        const hp = def.hp[0] + Math.floor(Math.random() * (def.hp[1] - def.hp[0] + 1));
        const enemy = {
          uid: `${id}_${i}`,
          id,
          def,
          hp,
          maxHp: hp,
          block: 0,
          statuses: { strength: 0, vulnerable: 0, weak: 0, plague: 0 },
          intent: null,
          _aiIdx: 0
        };
        G.combat.enemies.push(enemy);
        NP_OPS.enemyChooseMove(G, enemy);
      }
    });

    const energyPerTurnRelics = G.run.relics.filter(relic => relic.hook === 'energyPerTurn');
    G.combat.maxEnergy += energyPerTurnRelics.reduce((sum, relic) => sum + relic.value, 0);

    const innateCards = G.combat.draw.filter(inst => {
      const def = NP_CARDS[inst.id];
      return def && def.innate;
    });

    innateCards.forEach(inst => {
      const index = G.combat.draw.indexOf(inst);
      if (index !== -1) {
        G.combat.draw.splice(index, 1);
        G.combat.hand.push(inst);
      }
    });

    const drawTurn1Relic = G.run.relics.find(relic => relic.hook === 'drawTurn1');
    const extraDraws = drawTurn1Relic ? 1 : 0;
    NP_OPS.drawCards(G, 5 + extraDraws);

    G.combat.energy = G.combat.maxEnergy;

    NP_OPS.fireRelic(G, 'combatStartStrength');
    NP_OPS.fireRelic(G, 'combatStartBlock');

    if (window.NP_AUDIO) NP_AUDIO.sfx('turn_start');
    G.combat.log.push('Combat start');
  }

  window.NP_COMBAT = {
    start: function(run, enemyIds) { start(window.G, run, enemyIds); },
    playCard: function(uid, targetUid) { return playCard(window.G, uid, targetUid); },
    endTurn: function() { endTurn(window.G); },
    selectCard: function(uid) { selectCard(window.G, uid); },
    cancelSelect: function() { cancelSelect(window.G); },
    usePotion: function(id) { return usePotion(window.G, id); },
    canPlay: function(uid, targetUid) { return canPlay(window.G, uid, targetUid); },
    isOver: function() { return isOver(window.G); },
    result: function() { return result(window.G); }
  };
})();

  function mulberry32(seed) {

      }

    for (const floor of eliteFloors) {
      let eliteIndex = Math.floor(rng() * floors[floor].length);
      while (floors[floor][eliteIndex].type !== 'event') {
        eliteIndex = (eliteIndex + 1) % floors[floor].length;
      }
      floors[floor][eliteIndex].type = 'elite';
    }

    floors[bossFloor][0].type = 'boss';

    for (const node of nodes) {
      if (node.type === 'event' && rng() >= 0.45) {
        node.type = 'combat';
      }
    }

    for (const node of nodes) {
      if (node.type === 'combat') {
        let band;
        if (node.floor <= 5) band = 'early';
        else if (node.floor <= 10) band = 'mid';
        else band = 'late';
        const encounters = ACT_ENCOUNTERS[act][band];
        node.encounter = encounters[Math.floor(rng() * encounters.length)].slice();
      } else if (node.type === 'elite') {
        node.encounter = ACT_ENCOUNTERS[act].elite(node.floor).slice();
      } else if (node.type === 'boss') {
        node.encounter = ACT_ENCOUNTERS[act].boss.slice();
      }
    }

    for (let f = 1; f <= bossFloor; f++) {
      const prev = floors[f - 1];
      const next = floors[f];
      const seen = new Set();

      for (const n of next) {
        const p = prev[Math.floor(rng() * prev.length)];
        edges.push([p.uid, n.uid]);
        seen.add(p.uid + '>' + n.uid);
      }

      for (const p of prev) {
        if (edges.some(([a]) => a === p.uid)) continue;
        const n = next[Math.floor(rng() * next.length)];
        if (!seen.has(p.uid + '>' + n.uid)) {
          edges.push([p.uid, n.uid]);
          seen.add(p.uid + '>' + n.uid);
        }
      }

      if (rng() < 0.7 && next.length > 1) {
        const p = prev[Math.floor(rng() * prev.length)];
        const n = next[Math.floor(rng() * next.length)];
        if (!seen.has(p.uid + '>' + n.uid)) edges.push([p.uid, n.uid]);
      }
    }

    G.run.map = { floors, edges, current: null, done: [] };
}

  function render(container, onPick) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('map-svg');
    container.innerHTML = '';
    container.appendChild(svg);

    const map = G.run.map;
    const nodes = map.floors.flat();
    const edges = map.edges;

    for (const [fromUid, toUid] of edges) {
      const fromNode = nodes.find(n => n.uid === fromUid);
      const toNode = nodes.find(n => n.uid === toUid);

      if (!fromNode || !toNode) continue;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', `${fromNode.x}%`);
      line.setAttribute('y1', `${fromNode.y}%`);
      line.setAttribute('x2', `${toNode.x}%`);
      line.setAttribute('y2', `${toNode.y}%`);
      line.setAttribute('stroke', '#d4af37');
      line.setAttribute('stroke-width', '2');
      line.setAttribute('stroke-opacity', '0.55');
      svg.appendChild(line);
    }

    for (const node of nodes) {
      const btn = document.createElement('button');
      btn.classList.add('node');
      btn.dataset.uid = node.uid;
      btn.textContent = TYPE_GLYPHS[node.type];

      if (node.taken) {
        btn.classList.add('chosen');
      } else if (map.done.includes(node.uid)) {
        btn.classList.add('passed');
      } else if (map.current === node.uid) {
        btn.classList.add('pulse');
      }

      if (node.type === 'boss') {
        btn.classList.add('boss');
      }

      btn.style.left = `${node.x}%`;
      btn.style.top = `${node.y}%`;

      btn.addEventListener('click', () => {
        if (availableNodes().some(n => n.uid === node.uid)) {
          onPick(node);
        }
      });

      container.appendChild(btn);
    }
  }

  function availableNodes() {
    const map = G.run.map;
    if (!map.current) {
      return map.floors[0].filter(n => !map.done.includes(n.uid));
    }
    const curIdx = map.floors.findIndex(floor => floor.some(n => n.uid === map.current));
    const next = map.floors[curIdx + 1];
    if (!next) return [];
    const connected = next.filter(n => map.edges.some(([fromUid, toUid]) => fromUid === map.current && toUid === n.uid));
    return connected.length > 0 ? connected : next.filter(n => !map.done.includes(n.uid));
  }

  function nodeInfo(node) {
    const info = {
      floor: node.floor + 1,
      type: node.type,
      label: node.type.charAt(0).toUpperCase() + node.type.slice(1),
      encounter: null
    };

    if (node.encounter) {
      const enemyNames = node.encounter.map(id => {
        const enemy = NP_ENEMIES[id];
        return enemy ? enemy.name : id;
      });

      const counts = {};
      for (const name of enemyNames) {
        counts[name] = (counts[name] || 0) + 1;
      }

      info.encounter = Object.entries(counts)
        .map(([name, count]) => count > 1 ? `${name} × ${count}` : name)
        .join(', ');
    }

    return info;
  }

  function advanceTo(node) {
    if (!availableNodes().some(n => n.uid === node.uid)) {
      return null;
    }

    const map = G.run.map;
    node.taken = true;
    map.done.push(node.uid);
    map.current = node.uid;
    G.run.floor = node.floor + 1;
    G.run.currentNode = node.uid;
    return node;
  }

  window.NP_MAP = { generate, render, availableNodes, nodeInfo, advanceTo };
})();
</script>

    renderCardText(def, upgraded) {
      if (def.type === 'curse' && def.text) {
        return this.esc(def.text);
      }
      const effectTexts = def.effects.map(eff => {
        let text = '';
        switch (eff.op) {
          case 'damage':
            text = `Deal <b>${upgraded ? eff.up : eff.base}</b> damage`;
            if (def.target === 'all') text += ' <span class="kw">to ALL enemies</span>';
            if (eff.times) text += ` <b>${eff.times}</b> times`;
            break;
          case 'block': text = `Gain <b>${upgraded ? eff.up : eff.base}</b> Block`; break;
          case 'faith': text = `Gain <b>${upgraded ? eff.up : eff.base}</b> Faith`; break;
          case 'draw': text = `Draw <b>${upgraded ? eff.up : eff.base}</b> card(s)`; break;
          case 'energy': text = `Gain <b>${upgraded ? eff.up : eff.base}</b> Energy`; break;
          case 'heal': text = `Heal <b>${upgraded ? eff.up : eff.base}</b> HP`; break;
          case 'strength': text = `Gain <b>${upgraded ? eff.up : eff.base}</b> Strength`; break;
          case 'weak': text = `Apply <b>${upgraded ? eff.up : eff.base}</b> Weak`; break;
          case 'vulnerable': text = `Apply <b>${upgraded ? eff.up : eff.base}</b> Vulnerable`; break;
          case 'plague': text = `Apply <b>${upgraded ? eff.up : eff.base}</b> Plague`; break;
          case 'cleanse': text = 'Cleanse Weak, Vulnerable, Plague'; break;
          case 'blockPerTurn': text = `Each turn, gain <b>${upgraded ? eff.up : eff.base}</b> Block`; break;
          case 'strengthPerTurn': text = `Each turn, gain <b>${upgraded ? eff.up : eff.base}</b> Strength`; break;
          case 'faithPerTurn': text = `Each turn, gain <b>${upgraded ? eff.up : eff.base}</b> Faith`; break;
          case 'drawPerTurn': text = `Each turn, draw <b>${upgraded ? eff.up : eff.base}</b> extra card(s)`; break;
          case 'blockPlus': text = `Whenever you gain Block, +<b>${upgraded ? eff.up : eff.base}</b> more`; break;
          case 'weakOnAttack': text = `Attacks apply <b>${upgraded ? eff.up : eff.base}</b> Weak`; break;
          case 'thorns': text = `Reflect <b>${upgraded ? eff.up : eff.base}</b> damage when attacked`; break;
          case 'combatStartStrength': text = `At combat start, gain <b>${upgraded ? eff.up : eff.base}</b> Strength`; break;
          case 'combatStartBlock': text = `At combat start, gain <b>${upgraded ? eff.up : eff.base}</b> Block`; break;
        }
        return text;
      }).join(' ');
      const flags = [];
      if (def.exhaust) flags.push('Exhaust');
      if (def.ethereal) flags.push('Ethereal');
      if (def.innate) flags.push('Innate');
      if (def.retain) flags.push('Retain');
      if (flags.length > 0) {
        return `${effectTexts} <span class="kw">${flags.join(', ')}</span>`;
      }
      return effectTexts;
    },
    renderCard(defOrInst, opts = {}) {
      const def = typeof defOrInst === 'string' ? NP_CARDS[defOrInst] : NP_CARDS[defOrInst.id];
      const upgraded = opts.upgraded || (defOrInst.upgraded !== undefined ? defOrInst.upgraded : false);
      const cardId = typeof defOrInst === 'string' ? defOrInst : defOrInst.id;
      const typeLabel = def.type === 'attack' ? 'ATK' : def.type === 'skill' ? 'SKL' : def.type === 'power' ? 'PWR' : def.type === 'miracle' ? 'MIR' : def.type.substring(0, 3).toUpperCase();
      const cost = def.faithCost ? `<div class="cost-gem miracle">${def.faithCost}</div>` : `<div class="cost-gem">${def.cost}</div>`;
      return `
        <div class="card ${opts.selected ? 'selected' : ''} ${opts.unplayable ? 'unplayable' : ''} ${opts.tilt ? 'tilt' : ''}">
          <div class="card-inner rarity-${def.rarity}">
            ${cost}
            <div class="type-ribbon ${def.type}">${typeLabel}</div>
            <div class="card-art"><img src="assets/img/card_${cardId}.png" onerror="this.remove()" onload="this.nextElementSibling.style.display='none'"><span>${def.glyph}</span></div>
            <div class="card-name">${def.name}${upgraded ? '+' : ''}</div>
            <div class="rule"></div>
            <div class="card-text">${this.renderCardText(def, upgraded)}</div>
            ${upgraded ? '<div class="card-up">Upgraded</div>' : ''}
          </div>
        </div>
      `;
    },
    esc(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  };
  window.NP_UI = UI;
})();
</script>

    renderCombat: function() {
      var G = window.G;
      var combat = G.combat;
      if (!combat) return;

      var container = document.querySelector('.screen.combat');
      if (!container) return;

      // Enemy stage
      var enemyStage = container.querySelector('.enemy-stage');
      if (!enemyStage) return;

      enemyStage.innerHTML = '';
      combat.enemies.forEach(function(enemy, idx) {
        var enemyEl = document.createElement('div');
        enemyEl.className = 'enemy';

        hpText.className = 'hp-text';
        hpText.textContent = enemy.hp + '/' + enemy.maxHp;

        if (enemy.block > 0) {
          var blockBadge = document.createElement('div');
          blockBadge.className = 'hp-block';

          blockBadge.textContent = combat.playerBlock;

          cardEl.style.setProperty('--tilt-y', '0deg');
          cardEl.style.setProperty('--fan', '0');

              var amount = prev.enemyHps[idx] - enemy.hp;

                var rect = enemyEl.getBoundingClientRect();

            if (prev.enemyHps[idx] !== undefined && prev.enemyHps[idx] < enemy.hp) {
              var amount = enemy.hp - prev.enemyHps[idx];
              var enemyEl = enemyStage.querySelector('.enemy[data-uid="' + enemy.uid + '"]');

                var rect = enemyEl.getBoundingClientRect();

            var amount = prev.playerHp - G.run.hp;
            var playerPanel = playerHud.querySelector('.hp-bar');
            if (playerPanel) {
              var rect = playerPanel.getBoundingClientRect();
              window.NP_FX.damageNumber(rect.left + rect.width / 2, rect.top + rect.height / 2, amount, 'red');
              window.NP_FX.shake(4, 150);
            }
          }

          if (prev.playerBlock < combat.playerBlock) {
            var amount = combat.playerBlock - prev.playerBlock;
            var blockBadge = playerHud.querySelector('.hp-block');
            if (blockBadge) {
              var rect = blockBadge.getBoundingClientRect();
              window.NP_FX.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, {color: '#d4af37', count: 10, spread: 20});
            }
          }

          if (prev.faith < G.run.faith) {
            var amount = G.run.faith - prev.faith;
            var faithBar = playerHud.querySelector('.faith-bar');
            if (faithBar) {
              var rect = faithBar.getBoundingClientRect();
              window.NP_FX.sparkles(faithBar);
            }
          }
        }
      } catch (e) {
        console.error('FX error:', e);
      }

      // Update prev snapshot
      prev.enemyHps = combat.enemies.map(function(enemy) { return enemy.hp; });
      prev.playerHp = G.run.hp;
      prev.playerBlock = combat.playerBlock;
      prev.faith = G.run.faith;
      prev.handLen = combat.hand.length;

      // Turn banner
      if (combat.turn !== prev.turn) {
        UI.toast('Turn ' + combat.turn, 'info');
      }

      // Combat over
      if (combat.over) {
        var overlay = document.createElement('div');
        overlay.className = 'combat-overlay';
        overlay.textContent = combat.over === 'victory' ? 'VICTORY' : 'DEFEAT';
        overlay.style.backgroundColor = combat.over === 'victory' ? 'rgba(212,175,55,.25)' : 'rgba(139,26,26,.25)';
        container.appendChild(overlay);

        if (window.NP_FX) {
          window.NP_FX.flash(combat.over === 'victory' ? 'rgba(212,175,55,.25)' : 'rgba(139,26,26,.25)');
        }

        setTimeout(function() {
          overlay.remove();
        }, 1200);
      }

      prev.turn = combat.turn;
    }
  });

  function getStatusGlyph(status) {
    switch (status) {
      case 'strength': return '💪';
      case 'vulnerable': return '🎯';
      case 'weak': return '😵';
      case 'plague': return '☠️';
      default: return '';
    }
  }

  function aliveCount() {
    var G = window.G;
    var combat = G.combat;
    if (!combat) return 0;
    return combat.enemies.filter(function(enemy) { return enemy.hp > 0; }).length;
  }

  function firstAliveUid() {
    var G = window.G;
    var combat = G.combat;
    if (!combat) return null;
    var alive = combat.enemies.filter(function(enemy) { return enemy.hp > 0; });
    return alive.length > 0 ? alive[0].uid : null;
  }

  function pct(a, b) {
    return Math.floor((a / b) * 100);
  }

  function esc() {
    window.NP_COMBAT.cancelSelect();
  }
})();
